<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Zeno AI</title>
  <style>
    *{box-sizing:border-box} body{margin:0;background:#0b1020;color:#eef2ff;font-family:Arial,sans-serif;height:100vh;display:flex;flex-direction:column}
    header{padding:16px 22px;border-bottom:1px solid #26314f;display:flex;justify-content:space-between;align-items:center;background:#11182b}
    h1{margin:0;font-size:22px}.sub{color:#9fb0d3;font-size:12px;margin-top:5px}
    #chat{flex:1;overflow:auto;width:min(900px,100%);margin:auto;padding:22px;display:flex;flex-direction:column;gap:14px}
    .row{display:flex;gap:10px}.row.user{justify-content:flex-start}.row.bot{justify-content:flex-end}
    .bubble{max-width:80%;padding:13px 16px;border-radius:16px;white-space:pre-wrap;line-height:1.6}.user .bubble{background:#2563eb}.bot .bubble{background:#17213a;border:1px solid #2a3859}
    footer{padding:16px;background:#11182b;border-top:1px solid #26314f}.composer{display:flex;gap:10px;width:min(900px,100%);margin:auto}
    textarea{flex:1;resize:none;border-radius:14px;border:1px solid #334467;background:#0b1020;color:#fff;padding:13px;font-size:15px;min-height:52px;max-height:160px}
    button{border:0;border-radius:14px;background:#2563eb;color:#fff;padding:0 20px;cursor:pointer;font-weight:bold}button:disabled{opacity:.55;cursor:not-allowed}
    .clear{background:#26314f;padding:9px 14px;font-size:12px}.typing{opacity:.7;font-style:italic}
  </style>
</head>
<body>
<header>
  <div><h1>⚡ Zeno AI</h1><div class="sub">{{ model }}</div></div>
  <button class="clear" id="clear">مسح المحادثة</button>
</header>
<main id="chat">
  <div class="row bot"><div class="bubble">أهلًا! أنا Zeno. اكتب أي سؤال ونبدأ 🚀</div></div>
</main>
<footer><div class="composer"><textarea id="input" placeholder="اكتب رسالتك هنا..."></textarea><button id="send">إرسال</button></div></footer>
<script>
const chat=document.getElementById('chat'), input=document.getElementById('input'), send=document.getElementById('send');
let history=[];
function add(role,text,extra=''){const row=document.createElement('div');row.className='row '+(role==='user'?'user':'bot');row.innerHTML='<div class="bubble '+extra+'"></div>';row.querySelector('.bubble').textContent=text;chat.appendChild(row);chat.scrollTop=chat.scrollHeight;return row}
async function sendMessage(){const message=input.value.trim();if(!message||send.disabled)return;add('user',message);input.value='';input.style.height='52px';send.disabled=true;const loading=add('bot','Zeno يفكر...','typing');try{const r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message,history})});const d=await r.json();loading.remove();if(!r.ok)throw new Error(d.response||'حدث خطأ');const reply=d.response;add('bot',reply);history.push({role:'user',content:message},{role:'assistant',content:reply});}catch(e){loading.remove();add('bot','❌ '+e.message)}finally{send.disabled=false;input.focus()}}
send.onclick=sendMessage;input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,160)+'px'});document.getElementById('clear').onclick=()=>{history=[];chat.innerHTML='';add('bot','تم بدء محادثة جديدة ⚡')};
</script>
</body>
</html>
